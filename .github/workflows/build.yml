name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libcurl4-openssl-dev libsqlite3-dev pkg-config
      - name: Build
        run: make
      - name: Verify
        run: ./haris --version
      - uses: actions/upload-artifact@v4
        with:
          name: haris-linux-x86_64
          path: haris

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: brew install openssl curl sqlite pkg-config
      - name: Build
        env:
          PKG_CONFIG_PATH: /opt/homebrew/opt/openssl@3/lib/pkgconfig:/opt/homebrew/opt/curl/lib/pkgconfig:/opt/homebrew/opt/sqlite/lib/pkgconfig
        run: make
      - name: Verify
        run: ./haris --version
      - uses: actions/upload-artifact@v4
        with:
          name: haris-macos-arm64
          path: haris

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-pkg-config
      - name: Build
        run: make
      - name: Verify
        run: ./haris.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: haris-windows-x86_64
          path: haris.exe
